name: Python Tests & CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.14"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Check no API keys in tracked files
      run: |
        if git grep -n -E "(AIza[0-9A-Za-z_-]{20,}|gsk_[0-9A-Za-z]{20,}|sk-[0-9A-Za-z]{20,})" -- . ":!*.webm"; then
          echo "ERROR: Potential secret key detected in tracked files!"
          exit 1
        fi

    - name: Run pytest suite
      run: |
        pytest tests/ -v

    - name: Build Docker image
      run: |
        docker build -t finpulse:ci .
